name: Supabase Keep Alive

on:
  schedule:
    # Runs at 00:00 UTC every 3 days
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Keep-Alive API
        run: |
          curl -s -f "${{ secrets.SITE_URL || 'https://deuxsentique.vercel.app' }}/api/cron/keep-alive" || echo "Keep alive ping completed"
